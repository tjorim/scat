name: Rust Release Artifacts

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      # Rust build, test and packaging inputs. Keep new inputs in this list.
      # Website sources and unrelated prose do not trigger Rust jobs.
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'packaging/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      # Read by tests/compat.rs and bundled into the RPM.
      - 'docs/COMPATIBILITY.md'
      - 'docs/scat.example.yaml'
      - 'docs/scat-mapping.example.yaml'
      - 'docs/VENDORING.md'
      - 'docs/TUI_OPTIONS.md'
      - '.github/workflows/**'
      - '!.github/workflows/pages.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      # Rust build, test and packaging inputs. Keep new inputs in this list.
      # Website sources and unrelated prose do not trigger Rust jobs.
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'packaging/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      # Read by tests/compat.rs and bundled into the RPM.
      - 'docs/COMPATIBILITY.md'
      - 'docs/scat.example.yaml'
      - 'docs/scat-mapping.example.yaml'
      - 'docs/VENDORING.md'
      - 'docs/TUI_OPTIONS.md'
      - '.github/workflows/**'
      - '!.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux test and release build
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run tests
        run: cargo test --locked

      - name: Build Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Smoke test Linux binary
        run: |
          ./target/x86_64-unknown-linux-musl/release/scat --help
          ./target/x86_64-unknown-linux-musl/release/scat tui --help

      - name: Create compatibility database
        run: |
          mkdir -p target/compat
          # The fixture is stamped with the schema this tree compiles in;
          # nothing here is hardcoded, so a schema bump cannot leave the
          # smoke check silently testing the previous version.
          export SCHEMA_VERSION=$(sed -n 's/^pub const SCHEMA_VERSION: i64 = \([0-9][0-9]*\);$/\1/p' src/core/db.rs)
          test -n "$SCHEMA_VERSION"
          python - <<'PY'
          import os
          import json
          import sqlite3
          from pathlib import Path

          db = Path("target/compat/scripts.sqlite")
          conn = sqlite3.connect(db)
          conn.executescript("""
          CREATE TABLE scripts (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              logical_path TEXT NOT NULL UNIQUE,
              language TEXT,
              size INTEGER,
              mtime REAL,
              content_hash TEXT,
              content TEXT,
              owner TEXT,
              purpose TEXT,
              tags TEXT,
              entry_points TEXT,
              related TEXT,
              symlink_target TEXT,
              metadata_json TEXT,
              checkout_user TEXT,
              checkout_timestamp TEXT,
              checkout_os TEXT,
              checkout_age_seconds REAL,
              vc_warnings TEXT,
              indexed_at TEXT
          );
          CREATE INDEX idx_scripts_symlink_target ON scripts(symlink_target) WHERE symlink_target IS NOT NULL;
          CREATE VIRTUAL TABLE script_fts USING fts5(
              logical_path,
              content,
              owner,
              purpose,
              tags,
              content='scripts',
              content_rowid='id'
          );
          CREATE TRIGGER scripts_ai AFTER INSERT ON scripts BEGIN
              INSERT INTO script_fts(rowid, logical_path, content, owner, purpose, tags)
              VALUES (new.id, new.logical_path, new.content, new.owner, new.purpose, new.tags);
          END;
          CREATE TRIGGER scripts_ad AFTER DELETE ON scripts BEGIN
              INSERT INTO script_fts(script_fts, rowid, logical_path, content, owner, purpose, tags)
              VALUES ('delete', old.id, old.logical_path, old.content, old.owner, old.purpose, old.tags);
          END;
          CREATE TRIGGER scripts_au AFTER UPDATE ON scripts BEGIN
              INSERT INTO script_fts(script_fts, rowid, logical_path, content, owner, purpose, tags)
              VALUES ('delete', old.id, old.logical_path, old.content, old.owner, old.purpose, old.tags);
              INSERT INTO script_fts(rowid, logical_path, content, owner, purpose, tags)
              VALUES (new.id, new.logical_path, new.content, new.owner, new.purpose, new.tags);
          END;
          CREATE TABLE dependencies (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              script_id INTEGER NOT NULL REFERENCES scripts(id) ON DELETE CASCADE,
              depends_on_path TEXT NOT NULL,
              resolved_script_id INTEGER REFERENCES scripts(id) ON DELETE SET NULL,
              kind TEXT NOT NULL DEFAULT 'import',
              UNIQUE (script_id, depends_on_path, kind)
          );
          CREATE INDEX idx_dependencies_resolved_script_id ON dependencies(resolved_script_id);
          CREATE TABLE vc_checkouts (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              logical_path TEXT NOT NULL,
              physical_path TEXT NOT NULL,
              os_flavor TEXT NOT NULL,
              user TEXT NOT NULL,
              timestamp TEXT NOT NULL,
              age_seconds REAL,
              UNIQUE (physical_path)
          );
          CREATE INDEX idx_vc_checkouts_logical_path ON vc_checkouts(logical_path);
          CREATE TABLE function_definitions (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              script_id INTEGER NOT NULL REFERENCES scripts(id) ON DELETE CASCADE,
              name TEXT NOT NULL,
              kind TEXT NOT NULL,
              line INTEGER NOT NULL,
              docstring TEXT,
              decorators TEXT,
              UNIQUE (script_id, kind, name, line)
          );
          CREATE INDEX idx_function_definitions_script_id ON function_definitions(script_id);
          CREATE INDEX idx_function_definitions_name ON function_definitions(name);
          CREATE TABLE function_calls (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              script_id INTEGER NOT NULL REFERENCES scripts(id) ON DELETE CASCADE,
              caller TEXT NOT NULL,
              callee TEXT NOT NULL,
              line INTEGER NOT NULL,
              resolved_target_name TEXT,
              resolved_target_script_id INTEGER REFERENCES scripts(id) ON DELETE SET NULL
          );
          CREATE INDEX idx_function_calls_script_id ON function_calls(script_id);
          CREATE INDEX idx_function_calls_resolved_target_script_id ON function_calls(resolved_target_script_id);
          CREATE INDEX idx_function_calls_callee ON function_calls(callee);
          CREATE INDEX idx_function_calls_resolved_target_name ON function_calls(resolved_target_name);
          CREATE TABLE index_metadata (
              id INTEGER PRIMARY KEY CHECK (id = 1),
              build_timestamp TEXT NOT NULL,
              schema_version INTEGER NOT NULL,
              manifest_fingerprint TEXT NOT NULL DEFAULT ''
          );
          """)
          conn.execute(
              """
              INSERT INTO scripts
                  (logical_path, language, size, mtime, content, owner, purpose,
                   tags, entry_points, related, metadata_json, vc_warnings,
                   indexed_at)
              VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
              """,
              (
                  "/catalog/scripts/patch_check.py",
                  "python",
                  42,
                  0.0,
                  "def main():\n    return 'patch freeze'\n",
                  "owner@example.com",
                  "Verify patch freeze consistency",
                  json.dumps(["patching"]),
                  json.dumps(["main"]),
                  json.dumps([]),
                  json.dumps({"source": "python-compat-fixture"}),
                  json.dumps([]),
                  "2026-05-07T00:00:00Z",
              ),
          )
          conn.execute(
              "INSERT INTO index_metadata (id, build_timestamp, schema_version) VALUES (1, ?, ?)",
              ("2026-06-01T00:00:00Z", int(os.environ["SCHEMA_VERSION"])),
          )
          conn.commit()
          conn.close()

          # Unsupported neighbours of the current schema: one older, one newer.
          import shutil
          for name, delta in (("older", -1), ("newer", 1)):
              target = Path("target/compat") / name
              target.mkdir(exist_ok=True)
              copy = target / "scripts.sqlite"
              shutil.copy(db, copy)
              other = sqlite3.connect(copy)
              other.execute("UPDATE index_metadata SET schema_version = schema_version + ?", (delta,))
              other.commit()
              other.close()
          PY

      # Verifies the policy in docs/COMPATIBILITY.md against the release binary.
      - name: Smoke test Linux database compatibility
        run: |
          set -euo pipefail
          scat=./target/x86_64-unknown-linux-musl/release/scat
          cache="$PWD/target/compat/cache"
          mkdir -p "$cache"

          # Supported: the current schema reads, with the cache off and on.
          "$scat" --db target/compat/scripts.sqlite catalog info | tee target/compat/info.txt
          grep -F 'Compatibility      : compatible' target/compat/info.txt
          "$scat" --db target/compat/scripts.sqlite --no-cache search patch --output json
          "$scat" --db target/compat/scripts.sqlite --cache-dir "$cache" search patch --output json

          # Unsupported: older and newer schemas are refused, say which side
          # is behind, report a verdict, and leave the catalog untouched.
          for case in older:'the catalog publisher must upgrade':catalog_older newer:'upgrade scat on this host':catalog_newer; do
            IFS=: read -r name advice verdict <<<"$case"
            db="target/compat/$name/scripts.sqlite"
            sha256sum "$db" > "target/compat/$name.sha256"
            for cache_mode in off on; do
              mode=(--no-cache)
              if [[ "$cache_mode" == on ]]; then
                mode=(--cache-dir "$cache")
              fi
              for command_name in search stats info; do
                command=(catalog "$command_name")
                if [[ "$command_name" == search ]]; then
                  command=(search patch)
                fi
                if out=$("$scat" --db "$db" "${mode[@]}" "${command[@]}" 2>&1); then
                  echo "expected '${command[*]}' to refuse the $name catalog"; exit 1
                fi
                grep -F "$advice" <<<"$out"
              done
            done
            json=$("$scat" --db "$db" --no-cache catalog info --json 2>/dev/null || true)
            grep -F "\"compatibility\": \"$verdict\"" <<<"$json"
            sha256sum -c "target/compat/$name.sha256"
          done
          # Refusals must not have parked an unreadable catalog in the cache.
          test "$(find "$cache" -name '*.sqlite' | wc -l)" -eq 1

      - name: Report Linux binary size
        run: ls -lh target/x86_64-unknown-linux-musl/release/scat

      - name: Install cargo-about
        uses: taiki-e/install-action@cargo-about

      - name: Generate Linux dependency notices
        run: |
          notices=target/x86_64-unknown-linux-musl/release/THIRD_PARTY_NOTICES.txt
          cargo about generate --locked --fail --target x86_64-unknown-linux-musl about.hbs -o "$notices"
          cat /usr/share/doc/musl/copyright >> "$notices"
          libgcc=$(musl-gcc -print-libgcc-file-name)
          libgcc_package=$(dpkg-query -S "$libgcc" | head -1 | cut -d: -f1)
          cat "/usr/share/doc/$libgcc_package/copyright" >> "$notices"
          cp LICENSE NOTICE target/x86_64-unknown-linux-musl/release/
          test -s "$notices"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: scat-linux-x86_64-musl
          path: |
            target/x86_64-unknown-linux-musl/release/scat
            target/x86_64-unknown-linux-musl/release/LICENSE
            target/x86_64-unknown-linux-musl/release/NOTICE
            target/x86_64-unknown-linux-musl/release/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  rpm:
    name: RPM build and UBI userspace validation
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: scat-linux-x86_64-musl
          path: target/static
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Build reproducible RPM and upgrade fixture
        run: |
          chmod +x target/static/scat
          if readelf -l target/static/scat | grep -q INTERP; then exit 1; fi
          packaging/rpm/build.sh target/static/scat target/rpm/first 1
          packaging/rpm/build.sh target/static/scat target/rpm/repeated 1
          first_rpm=$(ls target/rpm/first/*.rpm)
          repeated_rpm=$(ls target/rpm/repeated/*.rpm)
          test "$(printf '%s\n' "$first_rpm" | wc -l)" -eq 1
          test "$(printf '%s\n' "$repeated_rpm" | wc -l)" -eq 1
          cmp "$first_rpm" "$repeated_rpm"
          packaging/rpm/build.sh target/static/scat target/rpm/second 2
          rpm -qpl "$first_rpm"
          rpm -qpR "$first_rpm" | tee target/rpm/requires.txt
          if grep -v '^rpmlib(' target/rpm/requires.txt; then exit 1; fi
          test -z "$(rpm -qp --scripts "$first_rpm")"
          rpm -qp --configfiles "$first_rpm" | grep -Fx /etc/scat/scat.yaml
          cp tests/support/tui_pty.py target/rpm/
          (cd target/static && sha256sum scat) > target/rpm/SHA256SUMS
          (cd target/rpm/first && sha256sum ./*.rpm) >> target/rpm/SHA256SUMS
      - name: Validate UBI 8, 9 and 10 userspaces
        run: |
          set -euo pipefail
          for major in 8 9 10; do
            image="registry.access.redhat.com/ubi${major}/ubi:latest"
            docker pull "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' | tee "target/rpm/ubi${major}-image.txt"
            if [ "$major" = 8 ]; then
              python_package=python39
              python_binary=python3.9
            else
              python_package=python3
              python_binary=python3
            fi
            docker run --rm --platform linux/amd64 \
              -e PYTHON="$python_binary" -e PYTHON_PACKAGE="$python_package" \
              -v "$PWD/target/rpm:/input:ro" \
              -v "$PWD/packaging/rpm/smoke.sh:/smoke.sh:ro" \
              "registry.access.redhat.com/ubi${major}/ubi:latest" \
              bash -c 'cat /etc/redhat-release; uname -m; rpm --version; dnf install -y "$PYTHON_PACKAGE" diffutils && bash /smoke.sh' | tee "target/rpm/ubi${major}-smoke.txt"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: scat-rpm-x86_64
          path: |
            target/rpm/first/*.rpm
            target/rpm/SHA256SUMS
            target/rpm/requires.txt
            target/rpm/ubi*.txt

  windows:
    name: Windows scat-embed build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # scat_core is Unix-only; -p scat-embed keeps this build from ever
      # touching that crate (scat-embed has no dependency on it).
      - name: Run tests
        run: cargo test -p scat-embed --locked

      - name: Build Windows binary
        run: cargo build -p scat-embed --release --locked

      - name: Smoke test Windows binary
        run: .\target\release\scat-embed.exe --help

      - name: Install cargo-about
        uses: taiki-e/install-action@cargo-about

      - name: Generate Windows dependency notices
        run: |
          $notices = "target/release/THIRD_PARTY_NOTICES.txt"
          cargo about generate --locked --fail --target x86_64-pc-windows-msvc --manifest-path crates/scat-embed/Cargo.toml -c about.toml about.hbs -o $notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # fastembed's native ONNX Runtime is separate from the Rust wrapper.
          foreach ($name in @("LICENSE", "ThirdPartyNotices.txt")) {
            $text = (Invoke-WebRequest "https://raw.githubusercontent.com/microsoft/onnxruntime/v1.28.0/$name").Content
            Add-Content -Path $notices -Value $text -Encoding utf8
          }
          Copy-Item LICENSE, NOTICE target/release/
          if ((Get-Item $notices).Length -eq 0) { throw "Empty dependency notices" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: scat-embed-windows-x86_64
          path: |
            target/release/scat-embed.exe
            target/release/LICENSE
            target/release/NOTICE
            target/release/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
