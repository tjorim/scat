name: Scat CI

on:
  push:
    branches:
      - 'main'
      - 'rust-rewrite'
      - 'feat/rust-phase-*'
    paths:
      # Rust build, test and packaging inputs. Keep new inputs in this list.
      # Website sources and unrelated prose do not trigger Rust jobs.
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'packaging/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      # Read by tests/compat.rs and bundled into the RPM.
      - 'docs/COMPATIBILITY.md'
      - 'docs/scat.example.yaml'
      - 'docs/scat-mapping.example.yaml'
      - 'docs/VENDORING.md'
      - 'docs/TUI_OPTIONS.md'
      - '.github/workflows/**'
      - '!.github/workflows/pages.yml'
  pull_request:
    branches:
      - 'main'
      - 'rust-rewrite'
      - 'feat/rust-phase-*'
    paths:
      # Rust build, test and packaging inputs. Keep new inputs in this list.
      # Website sources and unrelated prose do not trigger Rust jobs.
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'packaging/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      # Read by tests/compat.rs and bundled into the RPM.
      - 'docs/COMPATIBILITY.md'
      - 'docs/scat.example.yaml'
      - 'docs/scat-mapping.example.yaml'
      - 'docs/VENDORING.md'
      - 'docs/TUI_OPTIONS.md'
      - '.github/workflows/**'
      - '!.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo.toml owns the support floor; raising it is a deliberate policy change.
      - name: Read minimum supported Rust version
        id: msrv
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PYTHON

      - name: Set up minimum supported Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Check MSRV build
        run: cargo check --locked --all-targets

  test:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --all-targets

      - name: Run doc tests
        run: cargo test --workspace --locked --doc

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Install cargo-deny
        uses: taiki-e/install-action@98b24ef8830c90613ec3b57343df3abde2b66e56 # cargo-deny

      - name: Check advisories, licenses and duplicate dependencies
        run: |
          # Advisories (RustSec) are configured in deny.toml: vulnerabilities,
          # yanked releases and unmaintained/unsound crates fail unless listed
          # there with a reason. Both workspace members are checked.
          cargo deny --workspace check advisories
          cargo deny check licenses bans
          cargo deny --workspace check licenses
