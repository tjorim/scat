name: Scat CI

on:
  push:
    branches:
      - 'main'
      - 'rust-rewrite'
      - 'feat/rust-phase-*'
    paths:
      # Rust build, test and packaging inputs. Keep new inputs in this list.
      # Website sources and unrelated prose do not trigger Rust jobs.
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'packaging/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      # Read by tests/compat.rs and bundled into the RPM.
      - 'docs/COMPATIBILITY.md'
      - 'docs/scat.example.yaml'
      - 'docs/scat-mapping.example.yaml'
      - 'docs/VENDORING.md'
      - 'docs/TUI_OPTIONS.md'
      - '.github/workflows/**'
      - '!.github/workflows/pages.yml'
  pull_request:
    branches:
      - 'main'
      - 'rust-rewrite'
      - 'feat/rust-phase-*'
    paths:
      # Rust build, test and packaging inputs. Keep new inputs in this list.
      # Website sources and unrelated prose do not trigger Rust jobs.
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'packaging/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      # Read by tests/compat.rs and bundled into the RPM.
      - 'docs/COMPATIBILITY.md'
      - 'docs/scat.example.yaml'
      - 'docs/scat-mapping.example.yaml'
      - 'docs/VENDORING.md'
      - 'docs/TUI_OPTIONS.md'
      - '.github/workflows/**'
      - '!.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo.toml owns the support floor; raising it is a deliberate policy change.
      - name: Read minimum supported Rust version
        id: msrv
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PYTHON

      - name: Set up minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Check MSRV build
        run: cargo check --locked --all-targets

  test:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --all-targets

      - name: Run doc tests
        run: cargo test --workspace --locked --doc

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Fail on high-severity advisories
        run: |
          # cargo audit exits non-zero when any advisory matches, regardless of
          # severity; ignore its exit code and let the filter below decide.
          cargo audit --json > audit.json || true
          python - <<'PY'
          import json
          import sys

          with open("audit.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)

          high = []
          for vuln in report.get("vulnerabilities", {}).get("list", []):
              advisory = vuln.get("advisory", {})
              severity = (advisory.get("severity") or "").lower()
              if severity in {"high", "critical"}:
                  high.append(
                      {
                          "id": advisory.get("id", "unknown"),
                          "package": (vuln.get("package") or {}).get("name", "unknown"),
                          "severity": severity,
                          "title": advisory.get("title", ""),
                      }
                  )

          if high:
              print("High-severity advisories found:")
              for advisory in high:
                  print(
                      f"- [{advisory['severity']}] {advisory['id']} "
                      f"({advisory['package']}): {advisory['title']}"
                  )
              sys.exit(1)

          print("No high-severity advisories found.")
          PY

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses and duplicate dependencies
        run: |
          cargo deny check licenses bans
          cargo deny --workspace check licenses
