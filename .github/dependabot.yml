version: 2
updates:
  # Monitor Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "rust"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      # dtolnay/rust-toolchain's tag IS the Rust version — must match rust-version in Cargo.toml
      - dependency-name: "dtolnay/rust-toolchain"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # Monitor the website toolchain (Astro)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "javascript"
    # Dependabot runs pnpm with --config.minimum-release-age=4320 (3 days). Without a matching
    # cooldown it proposes releases younger than that, pnpm refuses them for transitive
    # dependencies (@babel/*, undici, ...) and the job fails with dependency_file_not_resolvable.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    groups:
      # astro and its @astrojs packages are pinned together and must move together.
      astro:
        patterns: ["astro", "@astrojs/*"]
