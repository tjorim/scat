# Example scat configuration file.
#
# Copy this file, edit it for your environment, then point scat at it with
# either flag or environment variable:
#
#   scat --config /path/to/scat.yaml ...
#   export SCAT_CONFIG=/path/to/scat.yaml
#
# JSON is also accepted; the format is picked from the file extension
# (.yml/.yaml -> YAML, anything else -> JSON). All fields are optional —
# omit anything you don't need.

# Path to the catalog SQLite database, as published on the shared drive.
# Overridden by --db / SCAT_DB.
db_path: /catalog/scat/scripts.sqlite

# Where each host keeps its local copy of the published catalog. Every
# read-only command copies the catalog here once per rebuild and queries
# the copy, so the shared drive is never in the query hot path. Defaults to
# /dev/shm (tmpfs, RAM-backed); overridden by --cache-dir / SCAT_CACHE_DIR.
# Pass --no-cache (or SCAT_NO_CACHE=1) to read the shared drive directly.
# cache_dir: /dev/shm

# Root directories scanned recursively by `scat catalog build` when
# --scan-root is not passed on the command line. Each root's *parent*
# directory name becomes the vc "os_flavor" for any DEVELOP/ARCHIVE
# checkouts found under it (e.g. "linux" from /catalog/linux/scripts) —
# so the OS-specific directory must be the parent, not a child, of the
# scripts directory itself.
scan_roots:
  - /catalog/linux/scripts
  - /catalog/windows/scripts

# Gitignore-style patterns applied during catalog scanning, in addition to
# any --ignore-file / .catignore file. The scanner does NOT read
# .gitignore or .ignore files, so anything you don't want indexed —
# notably Python virtualenvs and vendored dependencies — must be listed
# here explicitly.
ignore_patterns:
  - "*.pyc"
  - "__pycache__/"
  - "*.tmp"
  - ".venv/"
  - "venv/"
  - "site-packages/"
  - "node_modules/"

# vc (version-control checkout tool) integration settings.
vc:
  # Path to the vc executable. Falls back to PATH lookup if omitted.
  executable: /usr/local/bin/vc
  # Directory names treated as DEVELOP-type checkout containers.
  develop_dirs:
    - DEVELOP
  # Directory names treated as ARCHIVE-type checkout containers.
  archive_dirs:
    - ARCHIVE

# Named search aliases. `scat search @name` expands to the mapped free-text
# query. Note: this only expands the free-text search argument, not CLI
# flags — `lang:`/`owner:`/`tag:` filter tokens are a TUI search-box-only
# feature (see README) and are searched as literal text here, not applied
# as filters. Use `scat search @name --lang python` etc. to combine a
# bookmark with a flag-based filter instead.
bookmarks:
  patch-tools: "patch freeze"
  nightly-jobs: "nightly backup"
