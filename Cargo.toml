[package]
name = "scat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[[bin]]
name = "scat"
path = "src/main.rs"

[lib]
name = "scat_core"
path = "src/lib.rs"

[[bench]]
name = "indexing"
harness = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
once_cell = "1"
tempfile = "3"
ratatui = "0.30"
crossterm = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
ctrlc = { version = "3.5", features = ["termination"] }
comfy-table = "7"
unicode-width = "0.2"
ignore = "0.4.26"
rayon = "1"
similar = "3"
shell-words = "1"
clap_complete = "4.6.7"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled-full"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Build dependencies (rusqlite's bundled sqlite, proc-macros) don't benefit
# from release-grade optimization the way scat's own code does; keep them
# fast to compile instead.
[profile.release.build-override]
opt-level = 3
codegen-units = 4
