[package]
name = "scat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

# scat itself stays Unix-only (see src/lib.rs). scat-embed is a separate,
# ordinary cross-platform member so it can run on non-Unix laptops without
# touching that gate.
[workspace]
members = ["crates/scat-embed"]

[[bin]]
name = "scat"
path = "src/main.rs"

[lib]
name = "scat_core"
path = "src/lib.rs"

[[bench]]
name = "indexing"
harness = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
anyhow = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-highlight = "0.27"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
once_cell = "1"
tempfile = "3"
ratatui = "0.30"
crossterm = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
ctrlc = { version = "3.5", features = ["termination"] }
comfy-table = "8"
unicode-width = "0.2"
ignore = "0.4.26"
rayon = "1"
similar = "3"
shell-words = "1"
clap_complete = "4.6.7"
sha2 = "0.11"
hex = "0.4"
time = "0.3"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled-full"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[lints.clippy]
all = "warn"

# `pedantic`/`nursery` default to allow (at lower-than-lint priority, so the
# per-lint promotions below win): most of each group still needs real
# per-call-site work here (docs, signature changes, numeric-safety review)
# rather than a mechanical fix, and fixing them blind risks silently
# changing behavior. The lints below are the ones already cleaned up and
# promoted to warn so CI keeps enforcing them; see the issue tracker for
# the remaining pedantic/nursery backlog.
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

redundant_pub_crate = "warn"
redundant_closure_for_method_calls = "warn"
non_std_lazy_statics = "warn"
uninlined_format_args = "warn"
use_self = "warn"
wildcard_imports = "warn"
single_match_else = "warn"
unnecessary_wraps = "warn"
needless_raw_string_hashes = "warn"
trivially_copy_pass_by_ref = "warn"
items_after_statements = "warn"
default_trait_access = "warn"
ref_option = "warn"
useless_let_if_seq = "warn"
collection_is_never_read = "warn"
float_cmp = "warn"
case_sensitive_file_extension_comparisons = "warn"
needless_continue = "warn"
semicolon_if_nothing_returned = "warn"
elidable_lifetime_names = "warn"
bool_to_int_with_if = "warn"
stable_sort_primitive = "warn"
match_wildcard_for_single_variants = "warn"
duration_suboptimal_units = "warn"
doc_link_with_quotes = "warn"
redundant_clone = "warn"
unnested_or_patterns = "warn"
needless_type_cast = "warn"
missing_panics_doc = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Build dependencies (rusqlite's bundled sqlite, proc-macros) don't benefit
# from release-grade optimization the way scat's own code does; keep them
# fast to compile instead.
[profile.release.build-override]
opt-level = 3
codegen-units = 4
