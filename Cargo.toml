[package]
name = "scat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[[bin]]
name = "scat"
path = "src/main.rs"

[lib]
name = "scat_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
once_cell = "1"
tempfile = "3"
ratatui = "0.30"
crossterm = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
ctrlc = { version = "3.5", features = ["termination"] }
comfy-table = "7"
unicode-width = "0.2"
ignore = "0.4.26"
similar = "3"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled-full"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
