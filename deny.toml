[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  # rusqlite (via hashlink) and indexmap pull different hashbrown versions;
  # both are transitive-only and will converge when upstreams align.
  { name = "hashbrown" },
  # getrandom's WASI support currently resolves two transitive wit-bindgen
  # versions (via wasip2/wasip3); allow this duplicate until upstream converges.
  { name = "wit-bindgen" },
  # thiserror-impl 2.0.19 moved to syn 3.x while clap, serde_derive, ratatui,
  # and others are still on syn 2.x; allow this duplicate until they converge.
  { name = "syn" },
]

# scat-embed's HTTPS CA certificate data uses CDLA-Permissive-2.0.
# Section 2.1 requires the agreement text when sharing data; the
# agreement text is included in generated release notices.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]
